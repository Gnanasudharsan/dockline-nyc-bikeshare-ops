[project]
name = "dockline-api"
version = "0.1.0"
description = "Dockline API: live KPIs, Server-Sent Events, and governed Ask the Data."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyjwt>=2.9",
  "structlog>=24.4",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dockline_api"]
