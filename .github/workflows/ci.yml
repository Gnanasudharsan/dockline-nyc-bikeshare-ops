name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: SQLFluff (dbt models)
        working-directory: dbt
        run: uv run sqlfluff lint models

      - name: dbt deps and parse
        working-directory: dbt
        env:
          POSTGRES_PASSWORD: parse-only
        run: |
          uv run dbt deps
          uv run dbt parse

      - name: Pytest (unit + integration against a TimescaleDB container)
        run: uv run pytest

      - name: Pre-commit file hygiene
        # Ruff and mypy ran above; gitleaks runs in the secret-scan job.
        env:
          SKIP: ruff,ruff-format,mypy,gitleaks,sqlfluff
        run: uv run pre-commit run --all-files --show-diff-on-failure

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks over full history
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build, migrate, start, and wait for health
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test — live GBFS rows landed and the poll was audited
        run: |
          query() { docker compose exec -T timescaledb psql -U dockline -d dockline -tAc "$1"; }
          rows=$(query "SELECT count(*) FROM raw.station_status")
          runs=$(query "SELECT count(*) FROM ops.ingestion_runs WHERE feed = 'station_status' AND status = 'success'")
          echo "station_status rows: $rows, successful status runs: $runs"
          test "$rows" -gt 0
          test "$runs" -gt 0

      - name: dbt build inside the orchestration image, on live data
        run: |
          docker compose exec -T dagster-daemon \
            dbt build --project-dir /app/dbt --profiles-dir /app/dbt --target prod
          query() { docker compose exec -T timescaledb psql -U dockline -d dockline -tAc "$1"; }
          facts=$(query "SELECT count(*) FROM marts.fct_station_status_5min")
          board=$(query "SELECT count(*) FROM marts.mart_rebalancing_recommendations")
          echo "fct_station_status_5min rows: $facts, rebalancing board rows: $board"
          test "$board" -gt 0

      - name: Dagster loads the code location with every schedule running
        run: |
          query='{"query":"{ schedulesOrError(repositorySelector:{repositoryLocationName:\"dockline_orchestration.definitions\", repositoryName:\"__repository__\"}) { ... on Schedules { results { name scheduleState { status } } } } }"}'
          response=$(curl -sf localhost:3070/graphql -H 'content-type: application/json' -d "$query")
          echo "$response"
          test "$(echo "$response" | grep -o '"RUNNING"' | wc -l)" -eq 3

      - name: Service logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Tear down
        if: always()
        run: docker compose down -v
