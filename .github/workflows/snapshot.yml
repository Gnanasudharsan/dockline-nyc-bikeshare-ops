name: Snapshot

# Snapshot mode (ADR 0022): every 10 minutes, poll GBFS and Open-Meteo, compute the
# certified KPIs with the ingestion package, and publish three JSON files to the
# `data` branch: latest.json, history-24h.json, daily-kpis.json. The website reads them
# from raw.githubusercontent.com.
#
# GitHub ran the `*/10` schedule only every 4-8 hours, so one run now loops: a snapshot
# at each 10-minute mark for about 5.5 hours, then it starts the next run itself
# (workflow_dispatch). The hourly schedule is only a backstop that restarts the chain
# if it ever breaks; while a loop is running, those runs wait in the queue and are
# replaced by the next one.
#
# The data branch is an orphan branch kept at a single commit that each snapshot
# replaces (force-push to `data` only), so the repository does not grow. main is never
# touched. A failed run emails the repository owner, like the Uptime workflow.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write # push the data branch
  actions: write # start the next run of this workflow

# One loop at a time; a run that arrives while one is going waits for it.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      LOOP_MINUTES: 330
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and the ingestion package
        run: |
          uv python install 3.12
          uv sync --locked --package dockline-ingestion

      - name: Restore the previous snapshot from the data branch
        run: |
          mkdir -p snapshot
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C snapshot
            rm -rf snapshot/README.md snapshot/web
          else
            echo "No data branch yet; starting a new history."
          fi

      - name: Take a snapshot every 10 minutes for about 5.5 hours
        run: |
          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          failures=0
          while true; do
            if uv run --package dockline-ingestion python -m dockline_ingestion.snapshot --dir snapshot \
              && infra/snapshot/publish.sh snapshot; then
              failures=0
            else
              failures=$((failures + 1))
              echo "::warning::Snapshot failed ($failures in a row); trying again at the next 10-minute mark."
              if [ "$failures" -ge 3 ]; then
                echo "::error::Three snapshots in a row failed."
                exit 1
              fi
            fi
            now=$(date +%s)
            next=$(( (now / 600 + 1) * 600 + 15 ))  # 15 s past the next 10-minute mark
            if [ "$next" -ge "$deadline" ]; then break; fi
            sleep $(( next - now ))
          done

      - name: Start the next run
        if: ${{ !cancelled() }}
        run: gh workflow run snapshot.yml --ref main --repo "$GITHUB_REPOSITORY"
