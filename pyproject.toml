[project]
name = "dockline"
version = "0.0.0"
description = "Live operations intelligence for NYC bike share."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Gnanasudharsan Ashokumar" }]
dependencies = [
  "dockline-ingestion",
  "dockline-warehouse",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "testcontainers[postgres]>=4.8",
  "pyyaml>=6.0",
  "ruff>=0.8",
  "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["ingestion", "warehouse"]

[tool.uv.sources]
dockline-ingestion = { workspace = true }
dockline-warehouse = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/dbt_packages", "web"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "N",   # pep8-naming
  "S",   # flake8-bandit (security)
  "D",   # pydocstyle (public docstrings)
]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.isort]
known-first-party = ["dockline_ingestion", "dockline_warehouse", "ingestion_test_support"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106", "D"]
"tests/**" = ["S101", "D"]
"conftest.py" = ["S106", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["conftest.py", "tests", "ingestion/src", "ingestion/tests", "warehouse/src", "warehouse/tests"]
mypy_path = ["ingestion/tests"]
exclude = ["ingestion/tests/conftest\\.py$"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "sqlparse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "ingestion/tests", "warehouse/tests"]
pythonpath = ["ingestion/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs running Docker services",
]
