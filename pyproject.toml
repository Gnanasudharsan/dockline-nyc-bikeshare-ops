[project]
name = "dockline"
version = "0.0.0"
description = "Live operations intelligence for NYC bike share."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Gnanasudharsan Ashokumar" }]
dependencies = [
  "dockline-api",
  "dockline-ingestion",
  "dockline-orchestration",
  "dockline-warehouse",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "testcontainers[postgres]>=4.8",
  "pyyaml>=6.0",
  "ruff>=0.8",
  "types-pyyaml>=6.0",
  "sqlfluff>=3.4",
  "jsonschema>=4.23",
  "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["api", "ingestion", "orchestration", "warehouse"]

[tool.uv.sources]
dockline-api = { workspace = true }
dockline-ingestion = { workspace = true }
dockline-orchestration = { workspace = true }
dockline-warehouse = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/dbt_packages", "dbt/target", "web"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "N",   # pep8-naming
  "S",   # flake8-bandit (security)
  "D",   # pydocstyle (public docstrings)
]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.isort]
known-first-party = [
  "dockline_api",
  "dockline_ingestion",
  "dockline_orchestration",
  "dockline_warehouse",
  "ingestion_test_support",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "D"]
"tests/**" = ["S101", "S105", "D"]
"conftest.py" = ["S106", "D"]
# Grafana scripts call the local Grafana API; panel helpers have noun-phrase docstrings.
"grafana/*.py" = ["S310", "D401"]
# The dashboard generator holds long SQL/JSON literals and assembles Grafana queries
# from constants in this file (no user input reaches it).
"grafana/build_dashboards.py" = ["S310", "D401", "E501", "S608"]
# The Power BI generator holds long DAX/M literals; scripts call fixed git/HTTPS sources.
"powerbi/build_pbip.py" = ["E501", "D401"]
"powerbi/scripts/*.py" = ["S310", "S603", "S607", "E501"]
# The Ask the Data catalog holds one-line metric definitions (user-facing text).
"api/src/dockline_api/catalog.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = [
  "conftest.py",
  "tests",
  "ingestion/src",
  "ingestion/tests",
  "warehouse/src",
  "warehouse/tests",
  "orchestration/src",
  "orchestration/tests",
  "grafana",
  "scripts",
  "powerbi",
  "api/src",
  "api/tests",
  "evals",
]
mypy_path = ["ingestion/tests"]
exclude = ["ingestion/tests/conftest\\.py$"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "sqlparse.*", "dbt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "ingestion/tests", "warehouse/tests", "orchestration/tests", "api/tests"]
pythonpath = ["ingestion/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs running Docker services",
]
