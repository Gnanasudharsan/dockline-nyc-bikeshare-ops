# Dockline local stack.
# Production overrides live in infra/docker-compose.prod.yml (Phase 7).
# Rule: every service declares a healthcheck, a restart policy, and resource limits
# (enforced by tests/test_repo_hygiene.py). Every image must support linux/arm64.

name: dockline

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-warehouse-env: &warehouse-env
  POSTGRES_HOST: timescaledb
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-dockline}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-dockline}
  TZ: ${TZ:-America/New_York}

x-ingestion-build: &ingestion-build
  context: .
  dockerfile: ingestion/Dockerfile

x-orchestration-env: &orchestration-env
  <<: *warehouse-env
  DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
  DBT_TARGET: prod

services:
  timescaledb:
    # Community (non-OSS) build: includes compression and continuous aggregates.
    image: timescale/timescaledb:2.31.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dockline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dockline}
      TZ: ${TZ:-America/New_York}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      # Bound to localhost by default; never expose Postgres to the public internet.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging: *default-logging

  # One-shot job: applies pending migrations, then exits. Ingestion waits for it.
  migrate:
    # Reuses the image the ingestion service builds (Compose builds before starting).
    image: dockline-ingestion:local
    pull_policy: never
    command: ["python", "-m", "dockline_warehouse"]
    restart: "no"
    labels:
      dockline.role: oneshot
    environment:
      <<: *warehouse-env
      # Also creates Dagster's metadata database next to the warehouse.
      DOCKLINE_EXTRA_DATABASES: ${DAGSTER_POSTGRES_DB:-dagster}
      # Login password for the read-only serving role (migration 0010).
      DOCKLINE_READER_PASSWORD: ${DOCKLINE_READER_PASSWORD:?Run make env to generate DOCKLINE_READER_PASSWORD}
      # Login password for Power BI's read-only role (migration 0011).
      DOCKLINE_BI_PASSWORD: ${DOCKLINE_BI_PASSWORD:?Run make env to generate DOCKLINE_BI_PASSWORD}
    depends_on:
      timescaledb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

  ingestion:
    build: *ingestion-build
    image: dockline-ingestion:local
    restart: unless-stopped
    environment:
      <<: *warehouse-env
      GBFS_DISCOVERY_URL: ${GBFS_DISCOVERY_URL:-https://gbfs.citibikenyc.com/gbfs/gbfs.json}
      GBFS_PREFERRED_VERSION: ${GBFS_PREFERRED_VERSION:-2.3}
      OPEN_METEO_URL: ${OPEN_METEO_URL:-https://api.open-meteo.com/v1/forecast}
      NYC_LATITUDE: ${NYC_LATITUDE:-40.7128}
      NYC_LONGITUDE: ${NYC_LONGITUDE:--74.0060}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Healthy = a station_status poll succeeded within the last 3 minutes.
    healthcheck:
      test: ["CMD", "python", "-m", "dockline_ingestion.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # SIGTERM lets in-flight polls finish; the service exits within 30 s.
    stop_grace_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
    logging: *default-logging

  # Dagster UI: asset lineage, runs, schedules, checks. http://localhost:3070
  dagster-webserver:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    image: dockline-orchestration:local
    command:
      ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/app/orchestration/workspace.yaml"]
    restart: unless-stopped
    environment:
      <<: *orchestration-env
    ports:
      - "${DAGSTER_BIND_ADDRESS:-127.0.0.1}:${DAGSTER_PORT:-3070}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/server_info', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    logging: *default-logging

  # Runs schedules and sensors and launches runs (dbt builds run inside this container).
  dagster-daemon:
    image: dockline-orchestration:local
    pull_policy: never
    command: ["dagster-daemon", "run", "-w", "/app/orchestration/workspace.yaml"]
    restart: unless-stopped
    environment:
      <<: *orchestration-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dagster-daemon", "liveness-check"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536m
    logging: *default-logging

  # Cube Store: storage and query engine for Cube pre-aggregations, plus its cache/queue.
  cubestore:
    image: cubejs/cubestore:${CUBESTORE_IMAGE_TAG:-v1.8.20-arm64v8}
    restart: unless-stopped
    environment:
      CUBESTORE_REMOTE_DIR: /cube/data
      CUBESTORE_LOG_LEVEL: warn
      CUBESTORE_TELEMETRY: "false"
    volumes:
      - cubestore-data:/cube/data
    healthcheck:
      # The image has no curl/wget; probe the status port with bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3031 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *default-logging

  # Cube Core: the only place metrics are defined (semantic/model). REST API on 4000,
  # Postgres-compatible SQL API on 15432 (Grafana's metrics datasource).
  cube:
    image: cubejs/cube:v1.8.20
    restart: unless-stopped
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: timescaledb
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: ${POSTGRES_DB:-dockline}
      CUBEJS_DB_USER: dockline_reader
      CUBEJS_DB_PASS: ${DOCKLINE_READER_PASSWORD:?Run make env to generate DOCKLINE_READER_PASSWORD}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?Run make env to generate CUBEJS_API_SECRET}
      CUBEJS_SQL_USER: ${CUBEJS_SQL_USER:-dockline}
      CUBEJS_SQL_PASSWORD: ${CUBEJS_SQL_PASSWORD:?Run make env to generate CUBEJS_SQL_PASSWORD}
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_CUBESTORE_HOST: cubestore
      CUBEJS_DEV_MODE: "false"
      CUBEJS_TELEMETRY: "false"
      CUBEJS_SCHEDULED_REFRESH_DEFAULT: "true"
      CUBEJS_PRE_AGGREGATIONS_SCHEMA: dockline_pre_aggregations
      CUBEJS_LOG_LEVEL: warn
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./semantic:/cube/conf:ro
    ports:
      - "${CUBE_BIND_ADDRESS:-127.0.0.1}:${CUBE_PORT:-4000}:4000"
      - "${CUBE_BIND_ADDRESS:-127.0.0.1}:${CUBE_SQL_PORT:-15432}:15432"
    depends_on:
      migrate:
        condition: service_completed_successfully
      cubestore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *default-logging

  # Grafana OSS, provisioned entirely from grafana/ (datasources, dashboards, alerts).
  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run make env to generate GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 10s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/live-network-overview.json
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/New_York
      GF_USERS_DEFAULT_THEME: system
      # Read by the provisioning files (datasources use $__env{...}).
      DOCKLINE_READER_PASSWORD: ${DOCKLINE_READER_PASSWORD:?Run make env to generate DOCKLINE_READER_PASSWORD}
      CUBEJS_SQL_USER: ${CUBEJS_SQL_USER:-dockline}
      CUBEJS_SQL_PASSWORD: ${CUBEJS_SQL_PASSWORD:?Run make env to generate CUBEJS_SQL_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dockline}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3060}:3000"
    depends_on:
      cube:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging: *default-logging

  # Dockline API: live KPIs, SSE stream, stations for the map, and Ask the Data.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: dockline-api:local
    restart: unless-stopped
    environment:
      CUBE_API_URL: http://cube:4000/cubejs-api/v1
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?Run make env to generate CUBEJS_API_SECRET}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ASK_RATE_PER_MINUTE: ${ASK_RATE_PER_MINUTE:-6}
      ASK_DAILY_LIMIT: ${ASK_DAILY_LIMIT:-500}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3010}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${TZ:-America/New_York}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8070}:8000"
    depends_on:
      cube:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
    logging: *default-logging

volumes:
  timescaledb-data:
  cubestore-data:
  grafana-data:
