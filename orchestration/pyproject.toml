[project]
name = "dockline-orchestration"
version = "0.1.0"
description = "Dagster definitions that build the Dockline dbt project on a schedule."
requires-python = ">=3.12,<3.13"
dependencies = [
  "dagster>=1.13,<1.14",
  "dagster-dbt>=0.29,<0.30",
  "dagster-postgres>=0.29,<0.30",
  "dagster-webserver>=1.13,<1.14",
  "dbt-core>=1.11,<1.13",
  "dbt-postgres>=1.10,<1.12",
  "psycopg[binary]>=3.2",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dockline_orchestration"]
