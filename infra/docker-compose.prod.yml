# Production override for the Oracle Cloud Always Free ARM VM (Ampere A1, 4 OCPU, 24 GB).
#
#   docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml up -d --build --wait
#   (or: make prod-up)
#
# Differences from local:
# - Every published port is bound to 127.0.0.1 only. Nothing listens on a public
#   interface; Cloudflare Tunnel (outbound only) publishes api.<domain> and
#   grafana.<domain>. Postgres is never exposed.
# - restart: always, and memory limits sized for the VM.
# - cloudflared (tunnel) and backup (nightly pg_dump with rotation) services.
# Requires Docker Compose 2.24+ (for !override).

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  timescaledb:
    restart: always
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "effective_cache_size=6GB", "-c", "work_mem=32MB", "-c", "maintenance_work_mem=512MB", "-c", "max_connections=100"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8g
    logging: *prod-logging

  ingestion:
    restart: always
    logging: *prod-logging

  cubestore:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    logging: *prod-logging

  cube:
    restart: always
    ports: !override
      - "127.0.0.1:${CUBE_PORT:-4000}:4000"
      - "127.0.0.1:${CUBE_SQL_PORT:-15432}:15432"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    logging: *prod-logging

  dagster-webserver:
    restart: always
    ports: !override
      - "127.0.0.1:${DAGSTER_PORT:-3070}:3000"
    logging: *prod-logging

  dagster-daemon:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3g
    logging: *prod-logging

  grafana:
    restart: always
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT:-3060}:3000"
    logging: *prod-logging

  api:
    restart: always
    environment:
      WEB_ORIGINS: ${PROD_WEB_ORIGINS:?Set PROD_WEB_ORIGINS in .env (the website URL)}
    ports: !override
      - "127.0.0.1:${API_PORT:-8070}:8000"
    logging: *prod-logging

  # Cloudflare Tunnel: an outbound-only connection that publishes api.<domain> and
  # grafana.<domain> (routes are configured on the tunnel in the Cloudflare dashboard).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    restart: always
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *prod-logging

  # Nightly pg_dump of the warehouse and Dagster databases, rotated (infra/backup).
  backup:
    image: timescale/timescaledb:2.31.0-pg16
    entrypoint: ["/scripts/backup.sh"]
    restart: always
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dockline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dockline}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./infra/backup:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging: *prod-logging
