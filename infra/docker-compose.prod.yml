# Production override for the Oracle Cloud Always Free ARM VM (Ampere A1, 4 OCPU, 24 GB).
#
#   docker compose -f docker-compose.yml -f infra/docker-compose.prod.yml up -d --build --wait
#   (or: make prod-up)
#
# Differences from local:
# - Every service port is bound to 127.0.0.1 only. Postgres is never exposed.
# - HTTPS for the API and Grafana comes from one of two modes, chosen with
#   COMPOSE_PROFILES in .env (docs/adr/0021-https-modes.md):
#     cloudflare: Cloudflare Tunnel, outbound only; no inbound port is open.
#     duckdns:    Caddy on ports 80/443 with Let's Encrypt, for free DuckDNS
#                 subdomains; the only service that listens publicly.
# - restart: always, and memory limits sized for the VM.
# - backup (nightly pg_dump with rotation) runs in both modes.
# Requires Docker Compose 2.24+ (for !override).

x-logging: &prod-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  timescaledb:
    restart: always
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "effective_cache_size=6GB", "-c", "work_mem=32MB", "-c", "maintenance_work_mem=512MB", "-c", "max_connections=100"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8g
    logging: *prod-logging

  ingestion:
    restart: always
    logging: *prod-logging

  cubestore:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    logging: *prod-logging

  cube:
    restart: always
    ports: !override
      - "127.0.0.1:${CUBE_PORT:-4000}:4000"
      - "127.0.0.1:${CUBE_SQL_PORT:-15432}:15432"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    logging: *prod-logging

  dagster-webserver:
    restart: always
    ports: !override
      - "127.0.0.1:${DAGSTER_PORT:-3070}:3000"
    logging: *prod-logging

  dagster-daemon:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3g
    logging: *prod-logging

  grafana:
    restart: always
    environment:
      GF_SERVER_ROOT_URL: https://${PUBLIC_GRAFANA_HOST:?Set PUBLIC_GRAFANA_HOST in .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT:-3060}:3000"
    logging: *prod-logging

  api:
    restart: always
    environment:
      WEB_ORIGINS: ${PROD_WEB_ORIGINS:?Set PROD_WEB_ORIGINS in .env (the website URL)}
      # Trust X-Forwarded-For from the proxy (Caddy or cloudflared) so per-visitor rate
      # limits see the visitor, not the proxy. The API port is reachable only from
      # localhost and the Compose network.
      FORWARDED_ALLOW_IPS: "*"
    ports: !override
      - "127.0.0.1:${API_PORT:-8070}:8000"
    logging: *prod-logging

  # Cloudflare Tunnel (profile "cloudflare"): an outbound-only connection that publishes
  # the API and Grafana hosts (routes are configured on the tunnel in Cloudflare).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["cloudflare"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    restart: always
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *prod-logging

  # Caddy (profile "duckdns"): HTTPS on 80/443 with automatic Let's Encrypt certificates,
  # security headers, and an edge rate limit on /v1/ask (infra/caddy/Caddyfile).
  caddy:
    build: ./infra/caddy
    image: dockline/caddy:local
    profiles: ["duckdns"]
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:?Set PUBLIC_API_HOST in .env}
      PUBLIC_GRAFANA_HOST: ${PUBLIC_GRAFANA_HOST:?Set PUBLIC_GRAFANA_HOST in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *prod-logging

  # DuckDNS updater (profile "duckdns"): keeps both subdomains on the VM's public IP.
  duckdns:
    image: curlimages/curl:8.22.0
    profiles: ["duckdns"]
    entrypoint: ["/scripts/update.sh"]
    restart: always
    environment:
      DUCKDNS_DOMAINS: ${DUCKDNS_DOMAINS:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    volumes:
      - ./infra/duckdns:/scripts:ro
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32m
    logging: *prod-logging

  # Nightly pg_dump of the warehouse and Dagster databases, rotated (infra/backup).
  backup:
    image: timescale/timescaledb:2.31.0-pg16
    entrypoint: ["/scripts/backup.sh"]
    restart: always
    environment:
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-dockline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dockline}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB:-dagster}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./infra/backup:/scripts:ro
      - ${BACKUP_PATH:-./backups}:/backups
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 30m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging: *prod-logging

volumes:
  # Caddy's certificates and ACME account; must survive restarts (Let's Encrypt rate limits).
  caddy_data:
  caddy_config:
