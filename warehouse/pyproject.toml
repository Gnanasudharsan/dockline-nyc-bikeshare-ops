[project]
name = "dockline-warehouse"
version = "0.1.0"
description = "Versioned SQL migrations and a small migration runner for the Dockline warehouse."
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]>=3.2",
  "sqlparse>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dockline_warehouse"]
