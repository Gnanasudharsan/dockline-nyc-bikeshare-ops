[project]
name = "dockline-ingestion"
version = "0.1.0"
description = "Always-on poller for Citi Bike GBFS and Open-Meteo weather."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dockline_ingestion"]
