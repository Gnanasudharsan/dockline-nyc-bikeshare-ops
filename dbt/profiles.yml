# Connection settings come from the same env vars as the rest of the stack.
# Inside Docker Compose POSTGRES_HOST=timescaledb and POSTGRES_PORT=5432;
# on the host the defaults point at the published port 5433.
dockline:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'dockline') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dockline') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
      keepalives_idle: 60
    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'dockline') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dockline') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
      keepalives_idle: 60
